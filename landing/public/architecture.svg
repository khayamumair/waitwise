<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img">
  <title>WaitWise System Architecture v2</title>
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3B82F6"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8B5CF6"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#10B981"/></marker>
    <marker id="as" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#475569"/></marker>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F59E0B"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#080D18"/>

  <!-- Dividers (main area only) -->
  <line x1="0" y1="97" x2="1568" y2="97" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="258" x2="1568" y2="258" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="445" x2="1568" y2="445" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="635" x2="1568" y2="635" stroke="#1E293B" stroke-width="1"/>
  <line x1="0" y1="820" x2="1568" y2="820" stroke="#1E293B" stroke-width="1"/>

  <!-- Vertical separator -->
  <line x1="1572" y1="97" x2="1572" y2="1062" stroke="#1E293B" stroke-width="1.5"/>

  <!-- TITLE -->
  <text x="786" y="46" text-anchor="middle" font-size="32" font-weight="700" fill="#F1F5F9">WaitWise</text>
  <text x="786" y="74" text-anchor="middle" font-size="12" fill="#475569" letter-spacing="3" font-weight="500">INTELLIGENT WAITING LIST MANAGEMENT — SYSTEM ARCHITECTURE</text>
  <text x="1735" y="56" text-anchor="middle" font-size="10" fill="#475569" font-weight="700" letter-spacing="2.5">TECH STACK</text>
  <line x1="1588" y1="65" x2="1898" y2="65" stroke="#1E293B" stroke-width="1"/>

  <!-- ROW LABELS -->
  <text x="65" y="124" font-size="10" fill="#334155" font-weight="600" letter-spacing="2.5">DATA SOURCES</text>
  <text x="65" y="285" font-size="10" fill="#334155" font-weight="600" letter-spacing="2.5">STORAGE</text>
  <text x="65" y="472" font-size="10" fill="#334155" font-weight="600" letter-spacing="2.5">AGENTS</text>
  <text x="65" y="662" font-size="10" fill="#334155" font-weight="600" letter-spacing="2.5">COMMUNICATION</text>
  <text x="65" y="847" font-size="10" fill="#334155" font-weight="600" letter-spacing="2.5">OUTPUTS</text>

  <!-- ROW 1: DATA SOURCES -->
  <!-- Audit Log -->
  <rect x="60" y="108" width="205" height="135" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <rect x="60" y="108" width="205" height="3" rx="1.5" fill="#475569"/>
  <text x="162" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#CBD5E1">Audit Log</text>
  <text x="162" y="174" text-anchor="middle" font-size="12" fill="#475569">Tracks all events</text>
  <text x="162" y="192" text-anchor="middle" font-size="12" fill="#475569">across all users</text>
  <rect x="101" y="210" width="122" height="20" rx="4" fill="#1E293B"/>
  <text x="162" y="224" text-anchor="middle" font-size="9.5" fill="#64748B" letter-spacing="1">SYSTEM-WIDE</text>

  <!-- Local Patient Data -->
  <rect x="295" y="108" width="1258" height="135" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="295" y="108" width="1258" height="3" rx="1.5" fill="#3B82F6"/>
  <text x="924" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#93C5FD" letter-spacing="0.5">LOCAL PATIENT DATA</text>
  <text x="924" y="180" text-anchor="middle" font-size="13" fill="#475569">Patients · Referrals · Waiting List Status · Contact History</text>
  <rect x="670" y="200" width="95" height="22" rx="4" fill="#1E3A8A"/>
  <text x="717" y="215" text-anchor="middle" font-size="9.5" fill="#93C5FD">NHS RECORDS</text>
  <rect x="778" y="200" width="95" height="22" rx="4" fill="#1E3A8A"/>
  <text x="825" y="215" text-anchor="middle" font-size="9.5" fill="#93C5FD">GP REFERRALS</text>
  <rect x="886" y="200" width="115" height="22" rx="4" fill="#1E3A8A"/>
  <text x="943" y="215" text-anchor="middle" font-size="9.5" fill="#93C5FD">WAIT TIMELINES</text>
  <rect x="1014" y="200" width="125" height="22" rx="4" fill="#1E3A8A"/>
  <text x="1076" y="215" text-anchor="middle" font-size="9.5" fill="#93C5FD">CONTACT HISTORY</text>
  <rect x="1152" y="200" width="100" height="22" rx="4" fill="#1E3A8A"/>
  <text x="1202" y="215" text-anchor="middle" font-size="9.5" fill="#93C5FD">WAIT STATUS</text>

  <!-- ARROWS ROW 1→2 -->
  <path d="M 420 243 L 420 268" stroke="#3B82F6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <path d="M 890 243 L 890 268" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#as)"/>
  <path d="M 1365 243 L 1365 268" stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#ap)"/>

  <!-- ROW 2: STORAGE -->
  <!-- DuckDB -->
  <rect x="255" y="268" width="330" height="158" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="255" y="268" width="330" height="3" rx="1.5" fill="#3B82F6"/>
  <text x="420" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#93C5FD">DuckDB</text>
  <text x="420" y="340" text-anchor="middle" font-size="12" fill="#475569">Structures patient records.</text>
  <text x="420" y="358" text-anchor="middle" font-size="12" fill="#475569">Queried by all agents.</text>
  <rect x="310" y="378" width="65" height="20" rx="4" fill="#1E3A8A"/>
  <text x="342" y="392" text-anchor="middle" font-size="9.5" fill="#93C5FD">OLAP</text>
  <rect x="388" y="378" width="55" height="20" rx="4" fill="#1E3A8A"/>
  <text x="415" y="392" text-anchor="middle" font-size="9.5" fill="#93C5FD">SQL</text>
  <rect x="456" y="378" width="105" height="20" rx="4" fill="#1E3A8A"/>
  <text x="508" y="392" text-anchor="middle" font-size="9.5" fill="#93C5FD">IN-MEMORY</text>

  <!-- Run Scan pill -->
  <rect x="710" y="268" width="360" height="158" rx="79" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <text x="890" y="323" text-anchor="middle" font-size="10" font-weight="600" fill="#34D399" letter-spacing="2">STEP 1 · TRIGGER</text>
  <text x="890" y="357" text-anchor="middle" font-size="22" font-weight="700" fill="#F1F5F9">Run Scan</text>
  <text x="890" y="382" text-anchor="middle" font-size="11" fill="#475569">Initiates the pipeline</text>

  <!-- ChromaDB -->
  <rect x="1200" y="268" width="340" height="158" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="1200" y="268" width="340" height="3" rx="1.5" fill="#8B5CF6"/>
  <text x="1370" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#C4B5FD">ChromaDB</text>
  <text x="1370" y="340" text-anchor="middle" font-size="12" fill="#475569">Vector store for RAG.</text>
  <text x="1370" y="358" text-anchor="middle" font-size="12" fill="#475569">Sentence-transformer embeddings.</text>
  <rect x="1262" y="378" width="72" height="20" rx="4" fill="#2E1065"/>
  <text x="1298" y="392" text-anchor="middle" font-size="9.5" fill="#C4B5FD">VECTOR</text>
  <rect x="1347" y="378" width="60" height="20" rx="4" fill="#2E1065"/>
  <text x="1377" y="392" text-anchor="middle" font-size="9.5" fill="#C4B5FD">RAG</text>
  <rect x="1420" y="378" width="95" height="20" rx="4" fill="#2E1065"/>
  <text x="1467" y="392" text-anchor="middle" font-size="9.5" fill="#C4B5FD">SEMANTIC</text>

  <!-- ARROWS ROW 2→3 -->
  <path d="M 760 426 L 760 445 L 410 445 L 410 455" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <path d="M 1020 426 L 1020 445 L 1160 445 L 1160 455" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <path d="M 420 426 L 420 445" stroke="#3B82F6" stroke-width="1" fill="none" stroke-dasharray="4,3"/>
  <path d="M 1370 426 L 1370 445 L 1160 445" stroke="#8B5CF6" stroke-width="1" fill="none" stroke-dasharray="4,3"/>

  <!-- ROW 3: AGENTS -->
  <!-- Monitor Agent -->
  <rect x="120" y="455" width="580" height="168" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="120" y="455" width="580" height="3" rx="1.5" fill="#3B82F6"/>
  <rect x="120" y="455" width="46" height="46" rx="8" fill="#3B82F6"/>
  <text x="143" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#F9FAFB">2</text>
  <text x="410" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#93C5FD">Monitor Agent</text>
  <text x="410" y="522" text-anchor="middle" font-size="13"><tspan fill="#475569">Queries </tspan><tspan fill="#93C5FD" font-weight="700">DuckDB</tspan><tspan fill="#475569"> and scans the full waiting list.</tspan></text>
  <text x="410" y="545" text-anchor="middle" font-size="13" fill="#475569">Generates a risk score per patient</text>
  <text x="410" y="565" text-anchor="middle" font-size="13" fill="#475569">based on predefined clinical rules.</text>
  <rect x="270" y="584" width="100" height="22" rx="4" fill="#1E3A8A"/>
  <text x="320" y="599" text-anchor="middle" font-size="9.5" fill="#93C5FD">RISK SCORING</text>
  <rect x="383" y="584" width="100" height="22" rx="4" fill="#1E3A8A"/>
  <text x="433" y="599" text-anchor="middle" font-size="9.5" fill="#93C5FD">RULE-BASED</text>
  <rect x="496" y="584" width="90" height="22" rx="4" fill="#1E3A8A"/>
  <text x="541" y="599" text-anchor="middle" font-size="9.5" fill="#93C5FD">FULL SCAN</text>

  <!-- Triage Agent -->
  <rect x="870" y="455" width="580" height="168" rx="10" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="870" y="455" width="580" height="3" rx="1.5" fill="#8B5CF6"/>
  <rect x="870" y="455" width="46" height="46" rx="8" fill="#8B5CF6"/>
  <text x="893" y="484" text-anchor="middle" font-size="22" font-weight="700" fill="#F9FAFB">3</text>
  <text x="1160" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#C4B5FD">Triage Agent</text>
  <text x="1160" y="522" text-anchor="middle" font-size="13"><tspan fill="#475569">Gets clinical guidelines from </tspan><tspan fill="#C4B5FD" font-weight="700">RAG</tspan><tspan fill="#475569"> lookups (</tspan><tspan fill="#C4B5FD" font-weight="700">ChromaDB</tspan><tspan fill="#475569">).</tspan></text>
  <text x="1160" y="545" text-anchor="middle" font-size="13"><tspan fill="#FCD34D" font-weight="700">NVIDIA Nemotron</tspan><tspan fill="#475569"> scores urgency per patient</tspan></text>
  <text x="1160" y="565" text-anchor="middle" font-size="13" fill="#475569">and outputs a prioritised patient list.</text>
  <rect x="1058" y="584" width="105" height="22" rx="4" fill="#2E1065"/>
  <text x="1110" y="599" text-anchor="middle" font-size="9.5" fill="#C4B5FD">NEMOTRON</text>
  <rect x="1173" y="584" width="90" height="22" rx="4" fill="#2E1065"/>
  <text x="1218" y="599" text-anchor="middle" font-size="9.5" fill="#C4B5FD">RAG · LLM</text>

  <!-- ARROWS ROW 3→4 -->
  <path d="M 410 623 L 410 640 L 770 640 L 770 645" stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <path d="M 1160 623 L 1160 640 L 770 640 L 770 645" stroke="#8B5CF6" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

  <!-- ROW 4: COMMUNICATION -->
  <rect x="385" y="645" width="770" height="168" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="385" y="645" width="770" height="3" rx="1.5" fill="#10B981"/>
  <rect x="385" y="645" width="46" height="46" rx="8" fill="#10B981"/>
  <text x="408" y="674" text-anchor="middle" font-size="22" font-weight="700" fill="#F9FAFB">4</text>
  <text x="770" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#6EE7B7">Communication Agent</text>
  <text x="770" y="712" text-anchor="middle" font-size="13"><tspan fill="#FCD34D" font-weight="700">Nemotron</tspan><tspan fill="#475569"> drafts personalised outreach to patient and referral centre.</tspan></text>
  <text x="770" y="734" text-anchor="middle" font-size="13"><tspan fill="#475569">A subsequent voice call via </tspan><tspan fill="#6EE7B7" font-weight="700">ElevenLabs</tspan><tspan fill="#475569"> gathers patient information</tspan></text>
  <text x="770" y="754" text-anchor="middle" font-size="13" fill="#475569">and confirms next steps in the care pathway.</text>
  <rect x="557" y="773" width="110" height="22" rx="4" fill="#064E3B"/>
  <text x="612" y="788" text-anchor="middle" font-size="9.5" fill="#6EE7B7">ELEVENLABS</text>
  <rect x="680" y="773" width="105" height="22" rx="4" fill="#064E3B"/>
  <text x="732" y="788" text-anchor="middle" font-size="9.5" fill="#6EE7B7">NEMOTRON</text>
  <rect x="798" y="773" width="120" height="22" rx="4" fill="#064E3B"/>
  <text x="858" y="788" text-anchor="middle" font-size="9.5" fill="#6EE7B7">VOICE + TEXT</text>
  <rect x="931" y="773" width="95" height="22" rx="4" fill="#064E3B"/>
  <text x="978" y="788" text-anchor="middle" font-size="9.5" fill="#6EE7B7">OUTREACH</text>

  <!-- ARROWS ROW 4→5 (Comm → GP and Coordinator only) -->
  <path d="M 540 813 L 540 842 L 240 842 L 240 855" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <path d="M 1000 813 L 1000 842 L 690 842 L 690 855" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

  <!-- ROW 5: OUTPUTS -->
  <!-- GP Dashboard -->
  <rect x="60" y="855" width="360" height="92" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="60" y="855" width="360" height="3" rx="1.5" fill="#10B981"/>
  <text x="240" y="900" text-anchor="middle" font-size="14" font-weight="700" fill="#6EE7B7">GP Dashboard</text>
  <text x="240" y="922" text-anchor="middle" font-size="12" fill="#475569">Clinician-facing patient view</text>

  <!-- Coordinator Dashboard -->
  <rect x="500" y="855" width="380" height="92" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="500" y="855" width="380" height="3" rx="1.5" fill="#10B981"/>
  <text x="690" y="900" text-anchor="middle" font-size="14" font-weight="700" fill="#6EE7B7">Coordinator Dashboard</text>
  <text x="690" y="922" text-anchor="middle" font-size="12" fill="#475569">Waiting list management</text>

  <!-- Human Review Loop -->
  <path d="M 422 866 Q 461 832 498 866" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M 498 880 Q 461 846 422 880" stroke="#F59E0B" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="460" y="824" text-anchor="middle" font-size="8.5" fill="#F59E0B" font-weight="600" letter-spacing="0.5">HUMAN REVIEW</text>

  <!-- Coordinator → Patient Resurfaced -->
  <path d="M 880 901 L 1000 901" stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

  <!-- Patient Resurfaced -->
  <rect x="1000" y="855" width="360" height="92" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="1000" y="855" width="360" height="3" rx="1.5" fill="#3B82F6"/>
  <text x="1180" y="900" text-anchor="middle" font-size="14" font-weight="700" fill="#93C5FD">Patient Resurfaced</text>
  <text x="1180" y="922" text-anchor="middle" font-size="12" fill="#475569">Redirected &amp; prioritised</text>

  <!-- TECH STACK PANEL -->
  <rect x="1585" y="75" width="305" height="980" rx="10" fill="#0A0F18" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Item 1: DuckDB -->
  <rect x="1598" y="85" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="85" width="278" height="2.5" rx="1" fill="#3B82F6"/>
  <text x="1737" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#93C5FD">DuckDB</text>
  <text x="1737" y="130" text-anchor="middle" font-size="10" fill="#64748B">OLAP · In-Memory SQL</text>
  <text x="1737" y="150" text-anchor="middle" font-size="9.5" fill="#334155">Patient record storage</text>
  <text x="1737" y="167" text-anchor="middle" font-size="9.5" fill="#334155">and agent querying</text>

  <!-- Item 2: ChromaDB -->
  <rect x="1598" y="200" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="200" width="278" height="2.5" rx="1" fill="#8B5CF6"/>
  <text x="1737" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">ChromaDB</text>
  <text x="1737" y="245" text-anchor="middle" font-size="10" fill="#64748B">Vector Database · RAG</text>
  <text x="1737" y="265" text-anchor="middle" font-size="9.5" fill="#334155">Clinical guideline embeddings</text>
  <text x="1737" y="282" text-anchor="middle" font-size="9.5" fill="#334155">for triage lookups</text>

  <!-- Item 3: Nemotron -->
  <rect x="1598" y="315" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="315" width="278" height="2.5" rx="1" fill="#F59E0B"/>
  <text x="1737" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#FCD34D">Nemotron</text>
  <text x="1737" y="360" text-anchor="middle" font-size="10" fill="#64748B">Clinical LLM · Local</text>
  <text x="1737" y="380" text-anchor="middle" font-size="9.5" fill="#334155">Triage scoring and</text>
  <text x="1737" y="397" text-anchor="middle" font-size="9.5" fill="#334155">patient outreach drafting</text>

  <!-- Item 4: ElevenLabs -->
  <rect x="1598" y="430" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="430" width="278" height="2.5" rx="1" fill="#10B981"/>
  <text x="1737" y="457" text-anchor="middle" font-size="13" font-weight="700" fill="#6EE7B7">ElevenLabs</text>
  <text x="1737" y="475" text-anchor="middle" font-size="10" fill="#64748B">Voice AI · TTS</text>
  <text x="1737" y="495" text-anchor="middle" font-size="9.5" fill="#334155">Automated patient</text>
  <text x="1737" y="512" text-anchor="middle" font-size="9.5" fill="#334155">outreach calls</text>

  <!-- Item 5: Sentence Transformers -->
  <rect x="1598" y="545" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="545" width="278" height="2.5" rx="1" fill="#8B5CF6"/>
  <text x="1737" y="572" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">Sentence Transformers</text>
  <text x="1737" y="590" text-anchor="middle" font-size="10" fill="#64748B">Text Embeddings</text>
  <text x="1737" y="610" text-anchor="middle" font-size="9.5" fill="#334155">Powers ChromaDB RAG</text>
  <text x="1737" y="627" text-anchor="middle" font-size="9.5" fill="#334155">lookups for guidelines</text>

  <!-- Item 6: RAG Pipeline -->
  <rect x="1598" y="660" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="660" width="278" height="2.5" rx="1" fill="#8B5CF6"/>
  <text x="1737" y="687" text-anchor="middle" font-size="13" font-weight="700" fill="#C4B5FD">RAG Pipeline</text>
  <text x="1737" y="705" text-anchor="middle" font-size="10" fill="#64748B">Retrieval-Augmented Generation</text>
  <text x="1737" y="725" text-anchor="middle" font-size="9.5" fill="#334155">Grounds Nemotron on</text>
  <text x="1737" y="742" text-anchor="middle" font-size="9.5" fill="#334155">verified clinical guidelines</text>

  <!-- Item 7: Agentic Workflow -->
  <rect x="1598" y="775" width="278" height="107" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="1598" y="775" width="278" height="2.5" rx="1" fill="#475569"/>
  <text x="1737" y="802" text-anchor="middle" font-size="13" font-weight="700" fill="#CBD5E1">Agentic Workflow</text>
